<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>KAGE — The Anime Universe</title>
    <meta name="description" content="A cinematic anime universe and community platform featuring personalized anime discovery, guilds, fandom discussions, live WebRTC voice rooms, and head-to-head clashes." />
    <meta property="og:title" content="KAGE — The Anime Universe" />
    <meta property="og:description" content="A cinematic anime universe and community platform featuring personalized anime discovery, guilds, fandom discussions, live WebRTC voice rooms, and head-to-head clashes." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#09080B" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=JetBrains+Mono:wght@400;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-[#09080B] text-[#F5F1F2] antialiased selection:bg-[#C0263D] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function () {
        if (!window.location.hostname.endsWith('.github.io')) return;
        window.setTimeout(function () {
          var root = document.getElementById('root');
          if (!root || root.childElementCount > 0) return;
          root.innerHTML =
            '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#09080B;color:#F5F1F2;font-family:system-ui,-apple-system,sans-serif;">' +
            '<div style="max-width:480px;width:100%;background:#141116;border:1px solid rgba(255,255,255,0.12);border-radius:18px;padding:24px;text-align:center;">' +
            '<h1 style="margin:0 0 8px;font-size:20px;letter-spacing:0.08em;color:#F5F1F2;">KAGE — GitHub Pages Build Needed</h1>' +
            '<p style="margin:0 0 14px;font-size:13px;line-height:1.5;color:#A7A0AA;">GitHub Pages is currently serving unbuilt repository files instead of the compiled Vite bundle.</p>' +
            '<p style="margin:0;font-size:12px;line-height:1.6;color:#D8D2DC;background:#09080B;border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:12px;">In your GitHub repository go to <strong>Settings &rarr; Pages &rarr; Build and deployment &rarr; Source</strong> and select <strong>GitHub Actions</strong>, then re-run the deploy workflow.</p>' +
            '</div></div>';
        }, 4000);
      })();
    </script>
  </body>
</html>
